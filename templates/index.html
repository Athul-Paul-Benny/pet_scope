<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PetScope</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page">

    <!-- 🐶 LEFT IMAGE -->
    <div class="left-image">
        <img src="{{ url_for('static', filename='dog2.png') }}" alt="dog">
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-content">

        <h1 class="title">PetScope 🐾</h1>

        <div class="container">

            <p class="subtitle">Find your pet’s breed instantly ( dog or cat )</p>

            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <p>Click to Upload Image</p>
                <input type="file" id="fileInput" hidden>
            </div>

            <img id="preview">

            <button onclick="predict()">Analyze</button>

            <div id="results"></div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
